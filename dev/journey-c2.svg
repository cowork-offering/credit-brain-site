<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Lumen Descent — request flowing through five holographic lenses</title>
<desc id="d">A violet mote descends a vertical column through five tilted glass plates labelled Ask, Reason, Reach, Human, Learn; each lights as the mote passes, then a magenta answer rises back up.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a100ff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#c29bf5" stop-opacity="0.5"/>
<stop offset="1" stop-color="#a100ff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4f73ff" stop-opacity="0.15"/>
<stop offset="0.5" stop-color="#c29bf5" stop-opacity="0.5"/>
<stop offset="1" stop-color="#4f73ff" stop-opacity="0.15"/>
</linearGradient>
<radialGradient id="mote" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ece6f6"/><stop offset="0.45" stop-color="#a100ff"/><stop offset="1" stop-color="#a100ff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="amote" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ffe2ee"/><stop offset="0.45" stop-color="#ff3d8b"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/>
</radialGradient>
<style>
.lbl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:8px;fill:#b3abc4;letter-spacing:.6px;opacity:0;text-anchor:end}
.plate{transform-box:fill-box;transform-origin:center;opacity:.34}
/* per-plate ignite, staggered down the 9s loop */
.p1{animation:ign 9s linear infinite;animation-delay:.6s}
.p2{animation:ign 9s linear infinite;animation-delay:2.0s}
.p3{animation:ign 9s linear infinite;animation-delay:3.4s}
.p4{animation:ign 9s linear infinite;animation-delay:4.8s}
.p5{animation:ign 9s linear infinite;animation-delay:6.2s}
.l1{animation:lab 9s linear infinite;animation-delay:.6s}
.l2{animation:lab 9s linear infinite;animation-delay:2.0s}
.l3{animation:lab 9s linear infinite;animation-delay:3.4s}
.l4{animation:lab 9s linear infinite;animation-delay:4.8s}
.l5{animation:lab 9s linear infinite;animation-delay:6.2s}
@keyframes ign{0%,4%{opacity:.30}9%{opacity:1}26%{opacity:.46}100%{opacity:.30}}
@keyframes lab{0%,3%{opacity:0}10%{opacity:.95}40%{opacity:.55}100%{opacity:.55}}
.ref{transform-box:fill-box;transform-origin:center;opacity:0}
.r1{animation:ref 9s linear infinite;animation-delay:.6s}
.r2{animation:ref 9s linear infinite;animation-delay:2.0s}
.r3{animation:ref 9s linear infinite;animation-delay:3.4s}
.r4{animation:ref 9s linear infinite;animation-delay:4.8s}
.r5{animation:ref 9s linear infinite;animation-delay:6.2s}
@keyframes ref{0%,4%{opacity:0;transform:scaleX(.4)}10%{opacity:.7;transform:scaleX(1)}24%{opacity:0;transform:scaleX(1.15)}100%{opacity:0}}
/* request mote descends, holds at human plate, then handoff */
.req{animation:descend 9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes descend{0%{transform:translateY(0);opacity:0}4%{opacity:1}50%{transform:translateY(160px)}57%{transform:translateY(160px)}66%{transform:translateY(228px);opacity:1}70%{transform:translateY(228px);opacity:0}100%{transform:translateY(228px);opacity:0}}
/* answer mote rises back up */
.ans{animation:ascend 9s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ascend{0%,68%{transform:translateY(228px);opacity:0}72%{opacity:1}96%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
/* spine brightens after a full pass = compounding */
.spineline{animation:learn 9s linear infinite}
@keyframes learn{0%{opacity:.45}72%{opacity:.45}90%{opacity:1}100%{opacity:.5}}
.guard{transform-box:fill-box;transform-origin:center;opacity:0}
.guard{animation:guard 9s linear infinite;animation-delay:4.8s}
@keyframes guard{0%,4%{opacity:0;transform:scale(.7)}10%{opacity:.9;transform:scale(1)}30%{opacity:.4}55%{opacity:.9}100%{opacity:0}}
.sys{opacity:.16}
.haloT{animation:halo 9s linear infinite}
@keyframes halo{0%,88%{opacity:0;transform:scale(.6)}94%{opacity:.8;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
</style>
</defs>

<!-- identity spine (acts as you) -->
<line class="spineline" x1="180" y1="34" x2="180" y2="262" stroke="url(#spine)" stroke-width="1.4"/>

<!-- faint bank systems (data stays put) -->
<g class="sys" filter="url(#soft)">
<circle cx="300" cy="150" r="3" fill="#4f73ff"/>
<circle cx="312" cy="138" r="2" fill="#4f73ff"/>
<circle cx="312" cy="162" r="2" fill="#4f73ff"/>
</g>

<!-- ===== five tilted glass plates ===== -->
<!-- helper: each plate is an ellipse (top face) reading as a tilted disc -->
<g>
<!-- P1 ASK -->
<g class="ref r1"><ellipse cx="180" cy="50" rx="78" ry="9" fill="url(#plate)"/></g>
<ellipse class="plate p1" cx="180" cy="50" rx="62" ry="12" fill="none" stroke="url(#plate)" stroke-width="1.4"/>
<text class="lbl l1" x="104" y="42">THE ASK</text>
<!-- P2 REASON -->
<g class="ref r2"><ellipse cx="180" cy="98" rx="86" ry="10" fill="url(#plate)"/></g>
<ellipse class="plate p2" cx="180" cy="98" rx="62" ry="12" fill="none" stroke="url(#plate)" stroke-width="1.4"/>
<text class="lbl l2" x="104" y="90">REASON · RETRIEVE</text>
<!-- P3 REACH -->
<g class="ref r3"><ellipse cx="180" cy="146" rx="84" ry="10" fill="url(#plate)"/></g>
<ellipse class="plate p3" cx="180" cy="146" rx="62" ry="12" fill="none" stroke="url(#plate)" stroke-width="1.4"/>
<text class="lbl l3" x="104" y="138">REACH SYSTEMS</text>
<!-- P4 HUMAN -->
<g class="ref r4"><ellipse cx="180" cy="194" rx="80" ry="10" fill="url(#plate)"/></g>
<ellipse class="plate p4" cx="180" cy="194" rx="62" ry="12" fill="none" stroke="url(#plate)" stroke-width="1.4"/>
<g class="guard"><circle cx="180" cy="194" r="17" fill="none" stroke="#ff3d8b" stroke-width="1.2" stroke-opacity=".8"/><path d="M173 194 l5 5 l9 -11" fill="none" stroke="#ece6f6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="lbl l4" x="104" y="186">A HUMAN DECIDES</text>
<!-- P5 LEARN -->
<g class="ref r5"><ellipse cx="180" cy="242" rx="82" ry="10" fill="url(#plate)"/></g>
<ellipse class="plate p5" cx="180" cy="242" rx="62" ry="12" fill="none" stroke="url(#plate)" stroke-width="1.4"/>
<text class="lbl l5" x="104" y="234">IT LEARNS</text>
</g>

<!-- request mote (descends) -->
<g class="req"><circle cx="180" cy="50" r="7" fill="url(#mote)" filter="url(#glow)"/></g>
<!-- answer mote (rises) -->
<g class="ans"><circle cx="180" cy="50" r="6" fill="url(#amote)" filter="url(#glow)"/></g>

<!-- compounding halo at top -->
<g class="haloT" transform-box="fill-box" transform-origin="180 34"><circle cx="180" cy="34" r="10" fill="none" stroke="#c29bf5" stroke-width="1.2"/></g>
</svg>