<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Living reference architecture: one request flowing through the brain</title>
<desc id="d">A tilted glowing boundary box with five tiers — Brain, Model, Tools, Data, Records — an MCP client on top and a governance frame around it; a request token descends, the work flares, the answer rises, and a learn arc loops back.</desc>
<defs>
<filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gs" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4.5"/></filter>
<linearGradient id="tierfill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a100ff" stop-opacity="0.16"/><stop offset="1" stop-color="#4f73ff" stop-opacity="0.06"/></linearGradient>
<radialGradient id="tok" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#caa8ff"/><stop offset="1" stop-color="#a100ff" stop-opacity="0.2"/></radialGradient>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
.lbl{fill:#ece6f6;font-size:7.4px;letter-spacing:.4px;}
.sub{fill:#b3abc4;font-size:5.8px;letter-spacing:.3px;}
.cap{fill:#caa8ff;font-size:6.2px;letter-spacing:1.2px;}
.tier{fill:url(#tierfill);stroke:rgba(200,170,255,.18);stroke-width:0.8;}
.scan{stroke:#c29bf5;stroke-width:1;opacity:0;}
#stack{transform-box:fill-box;transform-origin:180px 150px;animation:sway 11s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:perspective(620px) rotateY(-13deg) rotateX(5deg);}50%{transform:perspective(620px) rotateY(7deg) rotateX(3deg);}}
.lit{animation:lit 11s linear infinite;}
@keyframes lit{0%,100%{opacity:.0}}
.t1{animation:t1 11s ease-in-out infinite}.t2{animation:t2 11s ease-in-out infinite}.t3{animation:t3 11s ease-in-out infinite}.t4{animation:t4 11s ease-in-out infinite}.t5{animation:t5 11s ease-in-out infinite}
@keyframes t1{0%,10%{opacity:0}16%{opacity:1}24%,86%{opacity:0}92%{opacity:.7}100%{opacity:0}}
@keyframes t2{0%,20%{opacity:0}28%{opacity:1}36%,78%{opacity:0}84%{opacity:.55}100%{opacity:0}}
@keyframes t3{0%,32%{opacity:0}40%{opacity:1}50%,70%{opacity:0}76%{opacity:.45}100%{opacity:0}}
@keyframes t4{0%,44%{opacity:0}52%{opacity:1}62%{opacity:0}100%{opacity:0}}
@keyframes t5{0%,52%{opacity:0}58%{opacity:1}66%{opacity:0}100%{opacity:0}}
.gov{stroke:#ff3d8b;animation:gov 11s ease-in-out infinite;}
@keyframes gov{0%,14%{opacity:.22}18%{opacity:.85}26%{opacity:.22}40%{opacity:.85}48%{opacity:.22}60%{opacity:.85}68%{opacity:.22}90%{opacity:.85}100%{opacity:.22}}
#req{animation:reqpath 11s ease-in-out infinite;}
@keyframes reqpath{0%{transform:translateY(0);opacity:0}6%{opacity:1}
14%{transform:translateY(40px)}26%{transform:translateY(78px)}40%{transform:translateY(116px)}52%{transform:translateY(154px)}
60%{transform:translateY(116px)}70%{transform:translateY(78px)}80%{transform:translateY(40px)}88%{transform:translateY(0)}
94%{opacity:1}100%{transform:translateY(0);opacity:0}}
#flare{animation:flare 11s ease-in-out infinite}
@keyframes flare{0%,44%{opacity:0;r:2}52%{opacity:.9;r:13}60%{opacity:0;r:2}100%{opacity:0}}
#ans{animation:ans 11s ease-in-out infinite}
@keyframes ans{0%,86%{opacity:0;r:2}92%{opacity:1;r:5.5}100%{opacity:.0;r:2}}
#learn{stroke-dasharray:150;stroke-dashoffset:150;animation:learn 11s ease-in-out infinite}
@keyframes learn{0%,90%{stroke-dashoffset:150;opacity:0}93%{opacity:.9}100%{stroke-dashoffset:0;opacity:.2}}
#breathe{animation:breathe 11s ease-in-out infinite}
@keyframes breathe{0%,92%{opacity:0}96%{opacity:.5}100%{opacity:0}}
</style>
</defs>

<g id="stack">
<rect id="breathe" x="44" y="38" width="272" height="232" rx="14" fill="#a100ff" opacity="0" filter="url(#gs)"/>

<rect class="gov" x="48" y="42" width="264" height="224" rx="13" fill="none" stroke-width="1.1" stroke-dasharray="3 4"/>
<text class="cap" x="180" y="36" text-anchor="middle">GOVERNED · AUDITED</text>

<g filter="url(#g)" transform="translate(132,18)">
<rect x="0" y="0" width="96" height="20" rx="5" fill="#06050a" stroke="#4f73ff" stroke-width="0.9"/>
<text class="lbl" x="48" y="9.5" text-anchor="middle">MCP client</text>
<text class="sub" x="48" y="16.5" text-anchor="middle">authenticated once</text>
</g>
<line x1="180" y1="38" x2="180" y2="58" stroke="rgba(200,170,255,.18)" stroke-width="0.8"/>

<g transform="translate(70,58)">
<rect class="tier" x="0" y="0" width="220" height="34" rx="7"/>
<rect class="tier t1" x="0" y="0" width="220" height="34" rx="7" fill="#a100ff" filter="url(#g)"/>
<line class="scan t1" x1="0" y1="17" x2="220" y2="17"/>
<text class="lbl" x="12" y="16">Brain</text><text class="sub" x="12" y="26">owned orchestrator</text>
</g>
<g transform="translate(70,96)">
<rect class="tier" x="0" y="0" width="220" height="34" rx="7"/>
<rect class="tier t2" x="0" y="0" width="220" height="34" rx="7" fill="#a100ff" filter="url(#g)"/>
<text class="lbl" x="12" y="16">Model</text><text class="sub" x="12" y="26">reasons · precedent</text>
</g>
<g transform="translate(70,134)">
<rect class="tier" x="0" y="0" width="220" height="34" rx="7"/>
<rect class="tier t3" x="0" y="0" width="220" height="34" rx="7" fill="#a100ff" filter="url(#g)"/>
<text class="lbl" x="12" y="16">Tools</text><text class="sub" x="12" y="26">your systems, in place</text>
</g>
<g transform="translate(70,172)">
<rect class="tier" x="0" y="0" width="220" height="34" rx="7"/>
<rect class="tier t4" x="0" y="0" width="220" height="34" rx="7" fill="#4f73ff" filter="url(#g)"/>
<text class="lbl" x="12" y="16">Data</text><text class="sub" x="12" y="26">never moves out</text>
</g>
<g transform="translate(70,210)">
<rect class="tier" x="0" y="0" width="220" height="34" rx="7"/>
<rect class="tier t5" x="0" y="0" width="220" height="34" rx="7" fill="#4f73ff" filter="url(#g)"/>
<text class="lbl" x="12" y="16">Records</text><text class="sub" x="12" y="26">captured · auditable</text>
</g>

<circle id="flare" cx="180" cy="189" r="2" fill="#caa8ff" filter="url(#g)"/>

<g id="req">
<circle cx="180" cy="48" r="4.5" fill="url(#tok)" filter="url(#g)"/>
<circle cx="180" cy="48" r="2" fill="#ffffff"/>
</g>
<circle id="ans" cx="180" cy="28" r="2" fill="#c29bf5" filter="url(#g)"/>

<path id="learn" d="M196 28 C 300 40, 300 120, 250 92 C 230 80, 210 78, 196 80" fill="none" stroke="#a100ff" stroke-width="1.3"/>
<text class="cap" x="180" y="284" text-anchor="middle" fill="#caa8ff" font-size="6px">EVERY DECISION SHARPENS THE NEXT</text>
</g>
</svg>