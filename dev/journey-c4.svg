<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Rotating holographic constellation: the brain hub and lending estate as a living network</title>
<desc id="d">A bright violet hub at center, satellite nodes on tilted orbital rings, light-edges between them, a request pulse traveling hub to nodes to a guarded human node and back, inside a shimmering governance halo, the whole network slowly rotating.</desc>
<defs>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softglow" x="-120%" y="-120%" width="340%" height="340%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="hub" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ece6f6"/><stop offset="35%" stop-color="#c29bf5"/><stop offset="100%" stop-color="#a100ff"/>
</radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="60%" stop-color="#a100ff" stop-opacity="0"/><stop offset="100%" stop-color="#a100ff" stop-opacity="0.14"/>
</radialGradient>
<style>
.edge{stroke:rgba(200,170,255,.18);stroke-width:1;fill:none}
.ring{stroke:rgba(200,170,255,.18);stroke-width:1;fill:none}
.node{fill:#caa8ff}
.lbl{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:7px;fill:#b3abc4;letter-spacing:.4px}
.twk{animation:twk 3.2s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.5;r:9}50%{opacity:.85;r:11}}
@keyframes hpulse{0%,100%{opacity:.85}48%{opacity:1}}
@keyframes guard{0%,72%,100%{opacity:0}80%,92%{opacity:.9}}
@keyframes haloshim{0%,100%{opacity:.5}50%{opacity:1}}
#rot{transform-origin:180px 150px;animation:spin 26s linear infinite}
#haloDash{stroke-dasharray:6 9;animation:haloshim 7s ease-in-out infinite}
</style>
</defs>

<!-- governance field -->
<ellipse cx="180" cy="150" rx="150" ry="96" fill="url(#halo)"/>
<ellipse id="haloDash" cx="180" cy="150" rx="146" ry="92" fill="none" stroke="#a100ff" stroke-width="1" opacity=".6"/>
<text x="180" y="34" text-anchor="middle" class="lbl" fill="#c29bf5" style="letter-spacing:1.4px">GOVERNED  ·  AUDITED</text>

<g id="rot">
<!-- tilted orbital rings -->
<ellipse class="ring" cx="180" cy="150" rx="118" ry="40"/>
<ellipse class="ring" cx="180" cy="150" rx="78" ry="92"/>

<!-- edges hub -> nodes -->
<line class="edge" x1="180" y1="150" x2="62"  y2="150"/>
<line class="edge" x1="180" y1="150" x2="298" y2="150"/>
<line class="edge" x1="180" y1="150" x2="180" y2="58"/>
<line class="edge" x1="180" y1="150" x2="180" y2="242"/>
<line class="edge" x1="180" y1="150" x2="116" y2="116"/>
<line class="edge" x1="180" y1="150" x2="246" y2="184"/>

<!-- request pulse path: hub -> ask(top) -> hub -> tool(right) -> human(bottom) -> hub -->
<path id="reqPath" class="edge" d="M180 150 L180 58 L180 150 L298 150 L180 242 L180 150" stroke="#ff3d8b" stroke-opacity="0" stroke-width="1.4"/>

<!-- satellite nodes -->
<g class="twk" style="animation-delay:0s"><circle class="node" cx="180" cy="58" r="4.5" filter="url(#glow)"/></g>
<g class="twk" style="animation-delay:.6s"><circle class="node" cx="298" cy="150" r="4" filter="url(#glow)"/></g>
<g class="twk" style="animation-delay:1.1s"><circle class="node" cx="62" cy="150" r="4" filter="url(#glow)"/></g>
<g class="twk" style="animation-delay:1.6s"><circle class="node" cx="116" cy="116" r="3.4" filter="url(#glow)"/></g>
<g class="twk" style="animation-delay:2.0s"><circle class="node" cx="246" cy="184" r="3.4" filter="url(#glow)"/></g>

<!-- human-decision node: distinct, guarded -->
<g>
<circle cx="180" cy="242" r="5.2" fill="#4f73ff" filter="url(#glow)"/>
<circle cx="180" cy="242" r="10" fill="none" stroke="#4f73ff" stroke-width="1.4" style="animation:guard 6s linear infinite"/>
</g>

<!-- traveling request pulse -->
<circle r="3" fill="#ff3d8b" filter="url(#glow)">
<animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;0.18;0.36;0.62;0.82;1" keyTimes="0;0.16;0.34;0.6;0.82;1" calcMode="linear">
<mpath href="#reqPath"/>
</animateMotion>
<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;1;1;1;0" keyTimes="0;0.05;0.34;0.6;0.82;0.95;1"/>
</circle>
<!-- brighter compounding return spark -->
<circle r="2.2" fill="#ece6f6" filter="url(#glow)">
<animateMotion dur="6s" begin="4.9s" repeatCount="indefinite" path="M180 242 L180 150"/>
<animate attributeName="opacity" dur="6s" begin="4.9s" repeatCount="indefinite" values="0;1;0" keyTimes="0;0.5;1"/>
</circle>

<!-- the brain hub -->
<circle cx="180" cy="150" r="22" fill="#a100ff" opacity=".22" filter="url(#softglow)" style="animation:breathe 6s ease-in-out infinite"/>
<circle cx="180" cy="150" r="11" fill="url(#hub)" filter="url(#glow)"/>
<circle cx="180" cy="150" r="3.2" fill="#ffffff"/>
</g>

<!-- counter-rotated labels stay upright -->
<text x="180" y="50" text-anchor="middle" class="lbl">THE ASK</text>
<text x="180" y="262" text-anchor="middle" class="lbl" fill="#9fb0ff">HUMAN DECIDES</text>
<text x="180" y="150" text-anchor="middle" class="lbl" dy="30" fill="#ece6f6" style="font-size:8px;letter-spacing:1px">THE BRAIN</text>
</svg>