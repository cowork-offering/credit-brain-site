<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Holographic orbital core: one request flows through the brain</title>
<desc id="d">A glowing violet brain core with tilted 3D orbital rings carrying model, tools and data nodes and an outer governance ring; a bright mote enters from a harness at top, spirals into the core, reaches out along the orbits, the human gate flares, and a return loop feeds the core.</desc>
<defs>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
<feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="core" cx="50%" cy="45%" r="60%">
<stop offset="0%" stop-color="#ece6f6"/><stop offset="35%" stop-color="#caa8ff"/>
<stop offset="72%" stop-color="#a100ff"/><stop offset="100%" stop-color="#a100ff" stop-opacity="0"/>
</radialGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#a100ff" stop-opacity=".40"/><stop offset="100%" stop-color="#a100ff" stop-opacity="0"/>
</radialGradient>
<style>
.spin{transform-origin:180px 156px}
.r1{animation:spin 26s linear infinite}
.r2{animation:spin 34s linear infinite reverse}
.r3{animation:spin 44s linear infinite}
.gov{animation:spin 70s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coreP{animation:beat 7s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.85;transform:scale(.97)}18%{opacity:.85;transform:scale(.97)}30%{opacity:1;transform:scale(1.1)}55%{opacity:.95;transform:scale(1.02)}}
.coreO{transform-origin:180px 156px}
.node{filter:url(#glow)}
.hairline{stroke:rgba(200,170,255,.18);fill:none}
.lbl{font:600 8.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#b3abc4;letter-spacing:.4px}
.lblI{font:700 8.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#ece6f6;letter-spacing:.4px}
.cap{font:600 7px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;fill:#b3abc4;letter-spacing:1px}
/* travelling request mote */
.mote{animation:mote 7s ease-in-out infinite}
@keyframes mote{
0%{offset-distance:0%;opacity:0}
4%{opacity:1}
30%{offset-distance:100%;opacity:1}
34%{opacity:0}100%{opacity:0}}
/* reach filament pulse */
.reach{stroke-dasharray:3 96;stroke-dashoffset:99;animation:reach 7s ease-in-out infinite}
@keyframes reach{0%,34%{stroke-dashoffset:99;opacity:0}40%{opacity:1}60%{stroke-dashoffset:-99;opacity:1}66%{opacity:0}100%{opacity:0}}
/* human gate flare + hold */
.gate{animation:gate 7s ease-in-out infinite}
@keyframes gate{0%,60%{opacity:.35;transform:scale(.9)}68%{opacity:1;transform:scale(1.25)}82%{opacity:1;transform:scale(1.18)}90%{opacity:.4;transform:scale(.9)}100%{opacity:.35}}
.gateO{transform-origin:180px 60px}
/* learn return arc */
.learn{stroke-dasharray:4 80;stroke-dashoffset:84;animation:learn 7s ease-in-out infinite}
@keyframes learn{0%,84%{stroke-dashoffset:84;opacity:0}88%{opacity:1}99%{stroke-dashoffset:0;opacity:.9}100%{opacity:0}}
/* node touch flicker on reach beat */
.touch{animation:touch 7s ease-in-out infinite}
@keyframes touch{0%,42%{opacity:.5}52%{opacity:1}64%{opacity:.5}100%{opacity:.5}}
</style>
</defs>

<!-- ambient halo -->
<circle cx="180" cy="156" r="120" fill="url(#halo)"/>

<!-- governance ring (outer, slow, faint, guarded perimeter) -->
<g class="spin gov">
<ellipse class="hairline" cx="180" cy="156" rx="138" ry="50" stroke-width="1"/>
<g class="hairline" stroke-width="1" stroke-dasharray="2 8" opacity=".7">
<ellipse cx="180" cy="156" rx="138" ry="50"/>
</g>
</g>
<!-- governance tick nodes -->
<g opacity=".8">
<circle cx="42" cy="156" r="2" fill="#4f73ff" filter="url(#glow)"/>
<circle cx="318" cy="156" r="2" fill="#4f73ff" filter="url(#glow)"/>
</g>

<!-- ORBIT 1 — Model -->
<g class="spin r1">
<ellipse class="hairline" cx="180" cy="156" rx="58" ry="92" stroke-width="1"/>
<circle class="node touch" cx="180" cy="64" r="4.2" fill="#caa8ff"/>
</g>
<!-- ORBIT 2 — Tools -->
<g class="spin r2">
<ellipse class="hairline" cx="180" cy="156" rx="96" ry="40" stroke-width="1"/>
<circle class="node touch" cx="276" cy="156" r="4.2" fill="#ff3d8b"/>
</g>
<!-- ORBIT 3 — Data -->
<g class="spin r3">
<ellipse class="hairline" cx="180" cy="156" rx="78" ry="70" stroke-width="1"/>
<circle class="node touch" cx="180" cy="226" r="4.2" fill="#4f73ff"/>
</g>

<!-- reach filament: core -> tools node region and back -->
<path class="reach" d="M180,156 C214,150 250,150 274,156" fill="none" stroke="#ff3d8b" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>

<!-- learn return arc curling back into core -->
<path class="learn" d="M120,196 C108,176 118,160 162,156" fill="none" stroke="#c29bf5" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>

<!-- BRAIN CORE -->
<g class="coreO">
<circle class="coreP" cx="180" cy="156" r="26" fill="url(#core)" filter="url(#soft)"/>
<circle cx="180" cy="156" r="13" fill="#ece6f6" opacity=".9" filter="url(#glow)"/>
<!-- inner precedent shimmer strokes -->
<g stroke="#ece6f6" stroke-width=".8" opacity=".55" fill="none">
<path d="M170,150 q10,-7 20,1"/><path d="M171,162 q9,6 19,-2"/>
</g>
</g>

<!-- MCP HARNESS pip + authenticated request origin (top) -->
<g>
<rect x="160" y="20" width="40" height="16" rx="5" class="hairline" stroke-width="1" fill="#06050a" fill-opacity=".4"/>
<circle cx="170" cy="28" r="2" fill="#caa8ff" filter="url(#glow)"/>
<text x="178" y="31" class="lblI" font-size="7">harness</text>
</g>

<!-- human gate diamond on governance ring (top) -->
<g class="gateO gate">
<rect x="172" y="52" width="16" height="16" rx="3" transform="rotate(45 180 60)" fill="#06050a" fill-opacity=".5" stroke="#caa8ff" stroke-width="1.4" filter="url(#glow)"/>
<circle cx="180" cy="60" r="2.4" fill="#caa8ff"/>
</g>

<!-- request mote: harness -> spiral into core -->
<path id="flight" d="M180,36 C180,46 180,52 180,64 C150,86 134,118 156,146 C168,158 174,156 180,156" fill="none" stroke="none"/>
<circle class="mote" r="3.2" fill="#ece6f6" filter="url(#glow)" style="offset-path:path('M180,36 C180,46 180,52 180,64 C150,86 134,118 156,146 C168,158 174,156 180,156')"/>

<!-- labels -->
<text x="180" y="56" text-anchor="middle" class="lbl">human gate</text>
<text x="180" y="49" text-anchor="middle" class="cap" font-size="6" fill="#caa8ff">DECIDES</text>
<text x="180" y="290" text-anchor="middle" class="cap">ASK · REASON · REACH · DECIDE · LEARN</text>
<text x="305" y="153" class="lbl" fill="#ff3d8b">tools</text>
<text x="180" y="246" text-anchor="middle" class="lbl" fill="#4f73ff">data</text>
<text x="180" y="58" text-anchor="middle" class="lbl" opacity="0">x</text>
</svg>