<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero orbit · ORIGINAL (torus-knot particle weave) — saved reference</title>
<!--
  This is the ORIGINAL Credit Brain hero header animation: the rotating
  particle torus-knot ("the winded thing in the middle"). Saved 2026-06-17 when the
  live hero (index.html, #scene) was switched to the DNA double helix, so this form
  is never lost. To restore it into the hero, port the geometry block + animate loop
  below back over the DNA block in index.html (keep the h1-typing / theme / view logic).
-->
<style>
  html,body{margin:0;height:100%;background:var(--bg,#06050a);overflow:hidden;transition:background .4s ease}
  html[data-theme="dark"]{--bg:#06050a}
  html[data-theme="light"]{--bg:#f4f1f9}
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#a89cc0;letter-spacing:.06em;text-align:center;pointer-events:none}
  .cap b{color:#c29bf5;font-weight:700}
  .theme{position:fixed;z-index:6;top:22px;right:28px;border:1px solid color-mix(in srgb,#fff 22%,transparent);background:transparent;
    color:#a89cc0;font:12px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:999px;cursor:pointer}
</style></head>
<body>
<canvas id="scene"></canvas>
<button class="theme" id="themeBtn">light</button>
<div class="cap"><b>Hero orbit · ORIGINAL</b> · rotating particle torus-knot · the form we ran before the DNA helix</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(); const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000); camera.position.z=5;
const COUNT=45000;
const positions=new Float32Array(COUNT*3), original=new Float32Array(COUNT*3), velocities=new Float32Array(COUNT*3), colors=new Float32Array(COUNT*3);
const knot=new THREE.TorusKnotGeometry(1.5,0.5,420,48); const kp=knot.attributes.position, kn=kp.count;
for(let i=0;i<COUNT;i++){ const vi=i%kn;
  const x=kp.getX(vi)+(Math.random()-0.5)*0.06, y=kp.getY(vi)+(Math.random()-0.5)*0.06, z=kp.getZ(vi)+(Math.random()-0.5)*0.06;
  positions[i*3]=original[i*3]=x; positions[i*3+1]=original[i*3+1]=y; positions[i*3+2]=original[i*3+2]=z; }
knot.dispose();
const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
const material=new THREE.PointsMaterial({size:0.02,vertexColors:true,transparent:true,depthWrite:false});
const points=new THREE.Points(geometry,material); scene.add(points);
const C_CORE=new THREE.Color(0xa100ff), C_LIGHT=new THREE.Color(0xcaa8ff), C_MAG=new THREE.Color(0xff3d8b), C_DEEP=new THREE.Color(0x3c1a6e), tmp=new THREE.Color();
function applyTheme(dk){ document.documentElement.setAttribute('data-theme',dk?'dark':'light'); document.getElementById('themeBtn').textContent=dk?'light':'dark';
  for(let i=0;i<COUNT;i++){ if(Math.random()<0.03) tmp.copy(C_MAG); else tmp.copy(C_CORE).lerp(C_LIGHT,Math.random()); if(!dk){ tmp.lerp(C_DEEP,0.5); tmp.multiplyScalar(0.85); }
    colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b; }
  geometry.attributes.color.needsUpdate=true; material.blending=dk?THREE.AdditiveBlending:THREE.NormalBlending; material.opacity=dk?0.80:0.42; material.needsUpdate=true; }
let dark=!(matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);
applyTheme(dark);
document.getElementById('themeBtn').addEventListener('click',()=>{ dark=!dark; applyTheme(dark); });
let mx=0,my=0;
addEventListener('mousemove',e=>{ mx=(e.clientX/innerWidth)*2-1; my=-(e.clientY/innerHeight)*2+1; });
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const R=1.5,R2=R*R, clock=new THREE.Clock();
function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime(); const mwx=mx*3,mwy=my*3;
  for(let i=0;i<COUNT;i++){ const ix=i*3,iy=ix+1,iz=ix+2;
    let px=positions[ix],py=positions[iy],pz=positions[iz], vx=velocities[ix],vy=velocities[iy],vz=velocities[iz];
    const dx=px-mwx,dy=py-mwy,dz=pz, d2=dx*dx+dy*dy+dz*dz;
    if(d2<R2){ const d=Math.sqrt(d2)||1e-4, f=(R-d)*0.009/d; vx+=dx*f; vy+=dy*f; vz+=dz*f; }
    const ox=original[ix],oy=original[iy],oz=original[iz];
    const hx=ox+Math.sin(t*0.45+ox*2+oy)*0.035, hy=oy+Math.cos(t*0.40+oy*2+oz)*0.035, hz=oz+Math.sin(t*0.50+oz*2+ox)*0.035;
    vx+=(hx-px)*0.0016; vy+=(hy-py)*0.0016; vz+=(hz-pz)*0.0016; vx*=0.95; vy*=0.95; vz*=0.95;
    positions[ix]=px+vx; positions[iy]=py+vy; positions[iz]=pz+vz; velocities[ix]=vx; velocities[iy]=vy; velocities[iz]=vz; }
  geometry.attributes.position.needsUpdate=true; points.rotation.y=t*0.08; points.rotation.x=Math.sin(t*0.08)*0.12;
  renderer.render(scene,camera); }
animate();
</script>
</body></html>
