<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Particle-stream brain: one request flowing through</title>
<desc id="d">A glowing violet particle orb on near-black. A request streams in from the left, reasons inside the orb, reaches out to faint system glyphs, passes a human gate, and a thin tail loops back to learn.</desc>
<defs>
<filter id="g" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gs" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="orb" cx="50%" cy="46%" r="55%"><stop offset="0%" stop-color="#caa8ff" stop-opacity=".55"/><stop offset="42%" stop-color="#a100ff" stop-opacity=".30"/><stop offset="100%" stop-color="#a100ff" stop-opacity="0"/></radialGradient>
<style>
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.985)}50%{opacity:.9;transform:scale(1.02)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes twk{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes gate{0%,62%,100%{stroke:#b3abc4;fill-opacity:.04}70%,92%{stroke:#c29bf5;fill-opacity:.16}}
.orbwrap{transform-origin:180px 138px;animation:breathe 6s ease-in-out infinite}
.ring{transform-origin:180px 138px;animation:spin 26s linear infinite}
.ring2{transform-origin:180px 138px;animation:spinr 34s linear infinite}
.p{fill:#caa8ff}
.tw{animation:twk 3.4s ease-in-out infinite}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
</style>
</defs>

<!-- baseline request path -->
<path d="M20 138 H120" stroke="rgba(200,170,255,.18)" stroke-width="1" fill="none"/>
<path d="M240 138 H300" stroke="rgba(200,170,255,.18)" stroke-width="1" fill="none"/>

<!-- ASK: harness glyph, top-left -->
<g transform="translate(20,128)">
<rect x="-4" y="-6" width="26" height="20" rx="3" fill="none" stroke="#4f73ff" stroke-width="1" opacity=".7"/>
<circle cx="2" cy="-1" r="1.1" fill="#4f73ff"/><circle cx="6" cy="-1" r="1.1" fill="#4f73ff"/>
<path d="M2 6 H16" stroke="#4f73ff" stroke-width="1" opacity=".6"/>
</g>
<text x="20" y="160" fill="#b3abc4" font-size="6.4" letter-spacing="1.2">ASK · authenticated as you</text>

<!-- the orb: same particle material as hero -->
<circle cx="180" cy="138" r="52" fill="url(#orb)" class="orbwrap" filter="url(#gs)"/>
<g class="ring" filter="url(#g)">
<circle class="p" cx="180" cy="92" r="1.3"/><circle class="p" cx="214" cy="106" r="1"/><circle class="p" cx="226" cy="138" r="1.4"/><circle class="p" cx="212" cy="172" r="1"/><circle class="p" cx="180" cy="186" r="1.3"/><circle class="p" cx="146" cy="170" r="1"/><circle class="p" cx="134" cy="138" r="1.4"/><circle class="p" cx="148" cy="104" r="1"/>
</g>
<g class="ring2" filter="url(#g)" opacity=".85">
<circle class="p" cx="180" cy="108" r="1"/><circle class="p" cx="206" cy="138" r="1.2"/><circle class="p" cx="180" cy="168" r="1"/><circle class="p" cx="154" cy="138" r="1.2"/><circle cx="196" cy="120" r="1" fill="#ff3d8b"/><circle cx="164" cy="156" r="1" fill="#ff3d8b"/>
</g>
<!-- dense inner core particles -->
<g filter="url(#g)">
<circle class="p tw" cx="180" cy="138" r="1.6"/><circle class="p tw" cx="172" cy="132" r="1" style="animation-delay:.5s"/><circle class="p tw" cx="188" cy="144" r="1" style="animation-delay:1s"/><circle class="p tw" cx="184" cy="128" r=".9" style="animation-delay:1.6s"/><circle class="p tw" cx="174" cy="148" r=".9" style="animation-delay:2.1s"/>
</g>

<!-- REACH: faint system glyphs + filaments -->
<g stroke="rgba(200,170,255,.18)" stroke-width="1" fill="none">
<path d="M150 100 L96 64"/><path d="M210 100 L264 64"/><path d="M150 176 L96 212"/><path d="M210 176 L264 212"/>
</g>
<g fill="none" stroke="#3D7A7A" stroke-width="1" opacity=".55" class="tw">
<rect x="84" y="54" width="20" height="16" rx="2"/><rect x="256" y="54" width="20" height="16" rx="2" style="animation-delay:.8s"/><rect x="84" y="206" width="20" height="16" rx="2" style="animation-delay:1.4s"/><rect x="256" y="206" width="20" height="16" rx="2" style="animation-delay:2s"/>
</g>
<text x="180" y="44" fill="#b3abc4" font-size="6.4" letter-spacing="1" text-anchor="middle">REACH · your systems, in place</text>

<!-- filament particles returning -->
<circle r="1.4" fill="#caa8ff" filter="url(#g)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M96 64 L150 100" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
<circle r="1.4" fill="#caa8ff" filter="url(#g)"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M264 212 L210 176"/><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>

<!-- DECIDE: human gate on the answer path -->
<rect x="244" y="130" width="16" height="16" rx="2" transform="rotate(45 252 138)" fill="#c29bf5" stroke="#b3abc4" stroke-width="1" style="animation:gate 9s ease-in-out infinite"/>
<text x="252" y="166" fill="#b3abc4" font-size="6.4" letter-spacing="1" text-anchor="middle">HUMAN</text>

<!-- LEARN: compounding loop, answer tail curls back -->
<path d="M300 138 C328 138 330 250 180 248 C70 246 48 196 70 168" fill="none" stroke="rgba(200,170,255,.18)" stroke-width="1" stroke-dasharray="2 4"/>
<text x="180" y="270" fill="#b3abc4" font-size="6.4" letter-spacing="1.4" text-anchor="middle">LEARN · every decision sharpens the next</text>

<!-- THE TRAVELING REQUEST COMET: ask -> reason -> answer out -> loop back -->
<g filter="url(#g)">
<circle r="2.2" fill="#ece6f6">
<animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0.30;0.34;0.62;0.66;1" keyTimes="0;0.30;0.42;0.62;0.74;1" calcMode="linear" path="M20 138 H180 M180 138 H300 M300 138 C328 138 330 250 180 248 C70 246 48 196 70 168"/>
<animate attributeName="opacity" values="0;1;1;1;.5;.5;1;1;0" keyTimes="0;0.06;0.30;0.62;0.66;0.74;0.9;0.96;1" dur="9s" repeatCount="indefinite"/>
<animate attributeName="r" values="2.2;2.2;3.4;2.2;2.2;1.4" keyTimes="0;0.30;0.40;0.62;0.74;1" dur="9s" repeatCount="indefinite"/>
</circle>
</g>
<!-- trailing particles for the comet (REASON dwell shimmer) -->
<circle r="1.3" fill="#caa8ff" filter="url(#g)"><animateMotion dur="9s" begin="0.4s" repeatCount="indefinite" keyTimes="0;0.30;0.62;1" keyPoints="0;0.5;0.85;1" calcMode="linear" path="M20 138 H180 H300 C328 138 330 250 180 248"/><animate attributeName="opacity" values="0;.8;.8;0" dur="9s" begin="0.4s" repeatCount="indefinite"/></circle>

<text x="78" y="138" fill="#ece6f6" font-size="6.4" letter-spacing="1" text-anchor="middle" opacity=".0"><animate attributeName="opacity" values="0;0;.7;0" keyTimes="0;0.3;0.45;0.6" dur="9s" repeatCount="indefinite"/>REASON</text>
</svg>